[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-sql-tutor"
version = "0.1.0"
description = "Local adaptive SQL tutor with a PostgreSQL learning lab."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "openai>=1.68,<2",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
adaptive-sql-tutor = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
